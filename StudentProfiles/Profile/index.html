           waitlisted:{en:'Waitlisted',uz:'Kutish ro\'yxatida',ru:'Список ожидания'},
           rejected:{en:'Rejected',uz:'Rad etilgan',ru:'Отказ'}};
  var ico={admitted:ICO_CHECK,waitlisted:ICO_CLOCK,rejected:ICO_X};
  return order.filter(function(t){return tags.indexOf(t)>-1;}).map(function(t){
    return '<span class="pd-badge '+t+'">'+ico[t]+lbl[t][currentLang]+'</span>';
  }).join('');
}
function primaryTag(tags){
  if(tags.indexOf('admitted')>-1) return 'admitted';
  if(tags.indexOf('waitlisted')>-1) return 'waitlisted';
  return 'rejected';
}
function schoolBlock(label, list, cls){
  if(!list.length) return '';
  return '<div class="pd-section-lbl">'+label+'</div><div class="pd-sch-list">'+
    list.map(function(s){
      var norm = normalizeSchool(s);
      var m = lookupSchool(norm);
      var icon = m ? schoolLogoIconHtml(m.name, m.domain) : '';
      return '<span class="pd-sch-tag '+cls+'">'+icon+s+'</span>';
    }).join('')+
  '</div>';
}
function ecListHtml(list){
  if(!list || !list.length) return '';
  return '<div class="pd-section-lbl">'+tr('ec_lbl')+'</div><ul class="pd-ec-list">'+
    list.map(function(s){return '<li>'+s+'</li>';}).join('')+
  '</ul>';
}
function listSectionHtml(labelKey, list){
  if(!list || !list.length) return '';
  return '<div class="pd-section-lbl">'+tr(labelKey)+'</div><ul class="pd-ec-list">'+
    list.map(function(s){return '<li>'+s+'</li>';}).join('')+
  '</ul>';
}
function essayHtml(essay){
  if(!essay) return '';
  return '<div class="pd-section-lbl">'+tr('essay_lbl')+'</div><div class="pd-essay">'+essay+'</div>';
}

function moreFromCountryHtml(p){
  var others = PROFILES.filter(function(x){ return x.country===p.country && x.id!==p.id; }).slice(0,3);
  if(!others.length) return '';
  return '<div class="more-country"><div class="more-country-lbl">'+tr('more_from')+' '+p.country+'</div><div class="more-country-list">'+
    others.map(function(o){
      return '<a class="more-country-item" href="/StudentProfiles/Profile/?id='+o.id+'"><b>'+o.name+'</b> — '+o.highlight+'</a>';
    }).join('')+
  '</div></div>';
}

function copyProfileLink(){
  var url = window.location.href;
  var btn = document.getElementById('shareBtn');
  function showCopied(){
    var original = tr('share_btn');
    btn.textContent = tr('share_copied');
    btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = original; btn.classList.remove('copied'); }, 1800);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(showCopied).catch(function(){
      window.prompt(tr('share_manual'), url);
    });
  } else {
    window.prompt(tr('share_manual'), url);
  }
}

function renderProfile(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var idx = PROFILES.findIndex(function(p){return p.id===id;});
  var content = document.getElementById('content');
  var crumbName = document.getElementById('crumbName');
  if(idx===-1){
    crumbName.textContent='';
    content.innerHTML =
      '<div class="not-found">'+
        '<div class="nf-ico">'+ICO_SEARCH+'</div>'+
        '<div style="font-weight:700;font-size:1.1rem;margin-bottom:.4rem" data-i18n="nf_h">'+tr('nf_h')+'</div>'+
        '<div style="color:var(--g500);margin-bottom:1.2rem" data-i18n="nf_s">'+tr('nf_s')+'</div>'+
        '<a class="back-link" href="/StudentProfiles/" data-i18n="nf_btn">'+tr('nf_btn')+'</a>'+
      '</div>';
    return;
  }
  var p = PROFILES[idx];
  crumbName.textContent = p.name.replace(/"/g,'');
  document.title = p.name.replace(/"/g,'') + ' — Chetta';
  var stats = statPillsHtml(p.stats);
  var prev = PROFILES[idx-1];
  var next = PROFILES[idx+1];
  content.innerHTML =
  '<div class="pd-card">'+
    '<div class="pd-hd">'+
      '<div class="pd-avatar '+primaryTag(p.tags)+'">'+p.initials+'</div>'+
      '<div><div class="pd-name">'+p.name+'</div><div class="pd-meta"><span class="pd-meta-tag">'+flagFor(p.country)+' '+p.country+'</span><span class="pd-meta-tag">'+p.year+'</span></div></div>'+
      '<div class="pd-badges">'+badgeHtml(p.tags)+'</div>'+
    '</div>'+
    '<div class="pd-highlight">'+p.highlight+'</div>'+
    (stats?'<div class="pd-stats">'+stats+'</div>':'<div class="pd-stats-note">'+(p.statsNote||tr('stats_undisclosed'))+'</div>')+
    schoolBlock(tr('schools_a'), p.accepted, 'a')+
    schoolBlock(tr('schools_w'), p.waitlisted, 'w')+
    schoolBlock(tr('schools_r'), p.rejected, 'r')+
    listSectionHtml('acad_lbl', p.academics)+
    listSectionHtml('bg_lbl', p.background)+
    ecListHtml(p.extracurriculars)+
    essayHtml(p.essay)+
    '<div class="pd-section-lbl">'+tr('story_lbl')+'</div>'+
    '<div class="pd-story">'+p.story+'</div>'+
    '<div class="pd-src-box">'+tr('source_lbl')+' <a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+p.sourceName+'</a></div>'+
    moreFromCountryHtml(p)+
  '</div>'+
  '<div class="pd-nav">'+
    (prev? '<a class="pd-nav-btn" href="/StudentProfiles/Profile/?id='+prev.id+'">'+tr('prev_btn')+'</a>' : '<span></span>')+
    (next? '<a class="pd-nav-btn" href="/StudentProfiles/Profile/?id='+next.id+'">'+tr('next_btn')+'</a>' : '<span></span>')+
  '</div>';
}

applyI18n();
renderProfile();
</script>
</body>
</html>
