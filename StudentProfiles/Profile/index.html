*{margin:0;padding:0;box-sizing:border-box}
:root{

html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:#fff;color:var(--g900);overflow-x:hidden;-webkit-font-smoothing:antialiased}

button{font-family:inherit;cursor:pointer}

nav{position:sticky;top:0;z-index:900;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--g200);height:58px;display:flex;align-items:center;padding:0 2rem;gap:1.5rem}
.nav-logo{font-family:'Instrument Serif',serif;font-size:1.4rem;color:var(--black);cursor:pointer;flex-shrink:0;letter-spacing:-.3px;display:flex;align-items:center;gap:.5rem}
.nav-logo img{height:32px;width:32px;object-fit:contain;flex-shrink:0}
.nav-logo em{color:var(--blue);font-style:normal}
.nav-right{display:flex;align-items:center;gap:.6rem;margin-left:auto}
.back-link{display:flex;align-items:center;gap:.35rem;background:none;border:1px solid var(--g200);color:var(--g700);font-size:.83rem;font-weight:500;padding:.4rem .9rem;border-radius:8px;transition:all .15s}
.back-link:hover{border-color:var(--g300);background:var(--g50)}
.lang-sw{position:relative}
.lang-btn{display:flex;align-items:center;gap:.3rem;background:none;border:1px solid var(--g200);border-radius:8px;padding:.4rem .7rem;font-size:.78rem;font-weight:600;color:var(--g700)}
.lang-btn:hover{border-color:var(--g300)}
.lang-dd{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--g200);border-radius:10px;box-shadow:var(--shadowlg);min-width:150px;display:none;overflow:hidden;z-index:50}
.lang-dd.open{display:block}
.lang-opt{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;font-size:.82rem;cursor:pointer}
.lang-opt:hover{background:var(--g50)}
.lang-opt.sel{background:var(--bluepale);font-weight:600}

.wrap{max-width:820px;margin:0 auto;padding:2.2rem 1.5rem 5rem}
.crumb{font-size:.82rem;color:var(--g500);margin-bottom:1.2rem}
.crumb a{color:var(--blue);font-weight:600}

.pd-card{border:1px solid var(--g200);border-radius:var(--rxl);padding:1.9rem 2rem;background:#fff}
.pd-hd{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.pd-avatar{width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;color:#fff;background:var(--g700)}
.pd-avatar.admitted{background:var(--green)}
.pd-avatar.rejected{background:var(--red)}
.pd-avatar.waitlisted{background:var(--amber)}
.pd-name{font-family:'Instrument Serif',serif;font-size:1.7rem;letter-spacing:-.3px}
.pd-meta{font-size:.85rem;color:var(--g500);margin-top:.15rem}
.pd-badges{display:flex;gap:.4rem;flex-wrap:wrap;margin-left:auto}
.pd-badge{font-size:.7rem;font-weight:700;padding:.25rem .65rem;border-radius:20px;white-space:nowrap}
.pd-badge.admitted{background:var(--gpale);color:var(--green)}
.pd-badge.rejected{background:var(--rpale);color:var(--red)}
.pd-badge.waitlisted{background:var(--apale);color:var(--amber)}

.pd-highlight{font-size:1.05rem;font-weight:600;color:var(--g900);line-height:1.45;padding:.9rem 1rem;background:var(--g50);border-radius:var(--r);margin-bottom:1.1rem}

.pd-stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.3rem}
.pd-stats-note{font-size:.78rem;color:var(--g400);font-style:italic;margin-bottom:1.3rem}
.pd-stat-pill{font-size:.78rem;font-weight:600;background:var(--g100);color:var(--g700);padding:.32rem .8rem;border-radius:20px}

.pd-section-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--g400);margin-bottom:.5rem;margin-top:1.3rem}
.pd-sch-list{display:flex;flex-wrap:wrap;gap:.45rem}
.pd-sch-tag{font-size:.82rem;font-weight:600;padding:.3rem .75rem;border-radius:9px}
.pd-sch-tag.a{background:var(--gpale);color:var(--green)}
.pd-sch-tag.r{background:var(--rpale);color:var(--red)}
.pd-sch-tag.w{background:var(--apale);color:var(--amber)}

.pd-story{font-size:.96rem;color:var(--g700);line-height:1.75}

footer{border-top:1px solid var(--g200);padding:1.6rem 2rem;text-align:center;color:var(--g400);font-size:.78rem;margin-top:2rem}

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k=el.getAttribute('data-i18n');
    el.textContent=tr(k);
  });
  document.getElementById('clbl').textContent=currentLang==='en'?'ENG':(currentLang==='uz'?'UZ':'RU');

    var el=document.getElementById('lang-'+l);
    if(el) el.classList.toggle('sel', l===currentLang);
  });
}

           waitlisted:{en:'🕒 Waitlisted',uz:'🕒 Kutish ro\'yxatida',ru:'🕒 Список ожидания'},
           rejected:{en:'❌ Rejected',uz:'❌ Rad etilgan',ru:'❌ Отказ'}};
  return order.filter(function(t){return tags.indexOf(t)>-1;}).map(function(t){
    return '<span class="pd-badge '+t+'">'+lbl[t][currentLang]+'</span>';
  }).join('');
}
function primaryTag(tags){
  if(tags.indexOf('admitted')>-1) return 'admitted';
  if(tags.indexOf('waitlisted')>-1) return 'waitlisted';
  return 'rejected';
}
function schoolBlock(label, list, cls){
  if(!list.length) return '';
  return '<div class="pd-section-lbl">'+label+'</div><div class="pd-sch-list">'+
    list.map(function(s){return '<span class="pd-sch-tag '+cls+'">'+s+'</span>';}).join('')+
  '</div>';
}

function renderProfile(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var idx = PROFILES.findIndex(function(p){return p.id===id;});
  var content = document.getElementById('content');
  var crumbName = document.getElementById('crumbName');
  if(idx===-1){
    crumbName.textContent='';
    content.innerHTML =
      '<div class="not-found">'+
        '<div class="nf-ico">🔎</div>'+
        '<div style="font-weight:700;font-size:1.1rem;margin-bottom:.4rem" data-i18n="nf_h">'+tr('nf_h')+'</div>'+
        '<div style="color:var(--g500);margin-bottom:1.2rem" data-i18n="nf_s">'+tr('nf_s')+'</div>'+
        '<a class="back-link" href="/StudentProfiles/" data-i18n="nf_btn">'+tr('nf_btn')+'</a>'+
      '</div>';
    return;
  }
  var p = PROFILES[idx];
  crumbName.textContent = p.name.replace(/"/g,'');
  document.title = p.name.replace(/"/g,'') + ' — Chetta';
  var stats = statPillsHtml(p.stats);
  var prev = PROFILES[idx-1];
  var next = PROFILES[idx+1];
  content.innerHTML =
  '<div class="pd-card">'+
    '<div class="pd-hd">'+
      '<div class="pd-avatar '+primaryTag(p.tags)+'">'+p.initials+'</div>'+
      '<div><div class="pd-name">'+p.name+'</div><div class="pd-meta">'+p.year+'</div></div>'+
      '<div class="pd-badges">'+badgeHtml(p.tags)+'</div>'+
    '</div>'+
    '<div class="pd-highlight">'+p.highlight+'</div>'+
    (stats?'<div class="pd-stats">'+stats+'</div>':'<div class="pd-stats-note">'+(p.statsNote||tr('stats_undisclosed'))+'</div>')+
    schoolBlock(tr('schools_a'), p.accepted, 'a')+
    schoolBlock(tr('schools_w'), p.waitlisted, 'w')+
    schoolBlock(tr('schools_r'), p.rejected, 'r')+
    '<div class="pd-section-lbl">&nbsp;</div>'+
    '<div class="pd-story">'+p.story+'</div>'+
    '<div class="pd-src-box">'+tr('source_lbl')+' <a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+p.sourceName+'</a></div>'+
  '</div>'+
  '<div class="pd-nav">'+
    (prev? '<a class="pd-nav-btn" href="/StudentProfiles/Profile/?id='+prev.id+'">'+tr('prev_btn')+'</a>' : '<span></span>')+
    (next? '<a class="pd-nav-btn" href="/StudentProfiles/Profile/?id='+next.id+'">'+tr('next_btn')+'</a>' : '<span></span>')+
  '</div>';
}

applyI18n();
renderProfile();
</script>
</body>
</html>
