}
function essayHtml(essay){
  if(!essay) return '';
  return '<div class="pd-section-lbl">'+tr('essay_lbl')+'</div><div class="pd-essay">'+essay+'</div>';
}

function renderProfile(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var idx = PROFILES.findIndex(function(p){return p.id===id;});
  var content = document.getElementById('content');
  var crumbName = document.getElementById('crumbName');
  if(idx===-1){
    crumbName.textContent='';
    content.innerHTML =
      '<div class="not-found">'+
        '<div class="nf-ico">🔎</div>'+
        '<div style="font-weight:700;font-size:1.1rem;margin-bottom:.4rem" data-i18n="nf_h">'+tr('nf_h')+'</div>'+
        '<div style="color:var(--g500);margin-bottom:1.2rem" data-i18n="nf_s">'+tr('nf_s')+'</div>'+
        '<a class="back-link" href="/StudentProfiles/" data-i18n="nf_btn">'+tr('nf_btn')+'</a>'+
      '</div>';
    return;
  }
  var p = PROFILES[idx];
  crumbName.textContent = p.name.replace(/"/g,'');
  document.title = p.name.replace(/"/g,'') + ' — Chetta';
  var stats = statPillsHtml(p.stats);
  var prev = PROFILES[idx-1];
  var next = PROFILES[idx+1];
  content.innerHTML =
  '<div class="pd-card">'+
    '<div class="pd-hd">'+
      '<div class="pd-avatar '+primaryTag(p.tags)+'">'+p.initials+'</div>'+
      '<div><div class="pd-name">'+p.name+'</div><div class="pd-meta">'+p.year+' · '+p.country+'</div></div>'+
      '<div class="pd-badges">'+badgeHtml(p.tags)+'</div>'+
    '</div>'+
    '<div class="pd-highlight">'+p.highlight+'</div>'+
    (stats?'<div class="pd-stats">'+stats+'</div>':'<div class="pd-stats-note">'+(p.statsNote||tr('stats_undisclosed'))+'</div>')+
    schoolBlock(tr('schools_a'), p.accepted, 'a')+
    schoolBlock(tr('schools_w'), p.waitlisted, 'w')+
    schoolBlock(tr('schools_r'), p.rejected, 'r')+
    ecListHtml(p.extracurriculars)+
    essayHtml(p.essay)+
    '<div class="pd-section-lbl">'+tr('story_lbl')+'</div>'+
    '<div class="pd-story">'+p.story+'</div>'+
    '<div class="pd-src-box">'+tr('source_lbl')+' <a href="'+p.sourceUrl+'" target="_blank" rel="noopener">'+p.sourceName+'</a></div>'+
  '</div>'+
  '<div class="pd-nav">'+
    (prev? '<a class="pd-nav-btn" href="/StudentProfiles/Profile/?id='+prev.id+'">'+tr('prev_btn')+'</a>' : '<span></span>')+
    (next? '<a class="pd-nav-btn" href="/StudentProfiles/Profile/?id='+next.id+'">'+tr('next_btn')+'</a>' : '<span></span>')+
  '</div>';
}

applyI18n();
renderProfile();
</script>
</body>
</html>
