<html>
  <body>
<section>

    <h2>Find Extracurricular Activities</h2>

    <input
        type="text"
        id="major"
        placeholder="Major"
    >

    <br><br>

    <input
        type="text"
        id="interests"
        placeholder="Interests (AI, Robotics, Programming)"
    >

    <br><br>

    <input
        type="text"
        id="city"
        placeholder="City"
    >

    <br><br>

    <input
        type="text"
        id="country"
        placeholder="Country"
    >

    <br><br>

    <button onclick="findActivities()">
        Search Opportunities
    </button>

    <hr>

    <div id="results"></div>

</section>

<script>

async function findActivities(){

    const major =
    document.getElementById("major").value;

    const interests =
    document.getElementById("interests")
    .value
    .split(",")
    .map(i=>i.trim());

    const city =
    document.getElementById("city").value;

    const country =
    document.getElementById("country").value;


    const response = await fetch(
        "http://localhost:3000/api/opportunities",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                major,
                interests,
                city,
                country

            })

        }
    );


    const data = await response.json();

    console.log(data);

    const container =
    document.getElementById("results");

    container.innerHTML = "";


    if(!data.recommendations){

        container.innerHTML =
        "<p>No recommendations found.</p>";

        return;

    }


    data.recommendations.forEach(activity=>{

        const div =
        document.createElement("div");

        div.innerHTML = `

            <h3>${activity.name}</h3>

            <p>${activity.description}</p>

            <p>

                <strong>College Impact:</strong>

                ${activity.collegeImpact}/10

            </p>

            <p>

                <strong>Skills:</strong>

                ${activity.skills.join(", ")}

            </p>

            <a
                href="${activity.website}"
                target="_blank"
            >
                Visit Website
            </a>

            <hr>

        `;

        container.appendChild(div);

    });

}

</script>
  </body>
</html>
