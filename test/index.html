<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Admission Helper</title>


<style>

body {

    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    background:#f5f7fb;

}


.container {

    background:white;
    padding:30px;
    border-radius:15px;

}


h1,h2 {

    text-align:center;

}


label {

    display:block;
    margin-top:15px;
    font-weight:bold;

}


input, textarea {


    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;

}


textarea {

    height:120px;

}


button {


    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;

}


button:hover {

    background:#1d4ed8;

}



#result {


    margin-top:25px;
    background:#eef2ff;
    padding:20px;
    border-radius:12px;

}


.score {

    font-size:28px;
    font-weight:bold;

}


li {

    margin-bottom:15px;

}


</style>


</head>


<body>


<div class="container">


<h1>
AI Admission Helper
</h1>



<label>
GPA
</label>

<input id="gpa" placeholder="Example: 4.0">



<label>
SAT Score
</label>

<input id="sat" placeholder="Example: 1410">



<label>
IELTS Score
</label>

<input id="ielts" placeholder="Example: 7.0">



<label>
Intended Major
</label>

<input id="major" placeholder="Example: Computer Science">



<label>
Preferred Country
</label>

<input id="country" placeholder="Example: USA">



<label>
Budget / Scholarship Need
</label>

<input id="budget" placeholder="Example: Need full scholarship">



<label>
Extracurricular Activities
</label>

<textarea id="activities"
placeholder="Example:
Built website
Olympiad participant
Volunteer work"></textarea>



<label>
Awards and Achievements
</label>

<textarea id="awards"
placeholder="Example:
Math Olympiad 3rd place
Hackathon finalist"></textarea>



<label>
Projects / Research
</label>

<textarea id="research"
placeholder="Example:
AI project
Research project"></textarea>




<button onclick="analyzeProfile()">

Analyze My Profile

</button>



<button onclick="findUniversities()">

Find Universities

</button>




<div id="result">

</div>



</div>





<script>


const API = "https://chetta-site.onrender.com";




// ==========================
// PROFILE ANALYSIS
// ==========================


async function analyzeProfile(){


const profile = getProfile();



try {


const response = await fetch(

API + "/api/profile",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(profile)

}

);



const data = await response.json();


console.log("PROFILE RESPONSE:", data);



const analysis =

typeof data.analysis === "string"

?

JSON.parse(data.analysis)

:

data.analysis;




document.getElementById("result").innerHTML = `



<h2>
Admission Analysis
</h2>



<div class="score">

Overall Score:
${analysis.overallScore}/100

</div>



<h3>
Categories
</h3>


<ul>

<li>
Academics:
${analysis.categories.academics}/100
</li>


<li>
Extracurriculars:
${analysis.categories.extracurriculars}/100
</li>


<li>
Leadership:
${analysis.categories.leadership}/100
</li>


<li>
Achievements:
${analysis.categories.achievements}/100
</li>


<li>
Uniqueness:
${analysis.categories.uniqueness}/100
</li>


</ul>




<h3>
Strengths
</h3>


<ul>

${analysis.strengths
.map(x=>`<li>${x}</li>`)
.join("")}

</ul>




<h3>
Weaknesses
</h3>


<ul>

${analysis.weaknesses
.map(x=>`<li>${x}</li>`)
.join("")}

</ul>




<h3>
Recommendations
</h3>


<ul>

${analysis.recommendations
.map(x=>`<li>${x}</li>`)
.join("")}

</ul>


`;



}

catch(error){

console.error(error);

alert("Profile analysis failed");

}


}







// ==========================
// UNIVERSITY RECOMMENDATION
// ==========================


async function findUniversities(){


const profile = getProfile();



try{


const response = await fetch(

API + "/api/universities",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(profile)

}

);



const data = await response.json();


console.log("UNIVERSITY RESPONSE:",data);



const universities = data.universities;



document.getElementById("result").innerHTML += `



<h2>
University Recommendations
</h2>




<h3>
With Scholarship
</h3>


<ul>

${universities.withScholarship.map(u=>`

<li>

<b>${u.university}</b>

<br>

Country:
${u.country}

<br>

Chance:
${u.chance}

<br>

Scholarship:
${u.scholarship}

<br>

${u.reason}

</li>


`).join("")}


</ul>





<h3>
Without Scholarship
</h3>


<ul>


${universities.withoutScholarship.map(u=>`

<li>

<b>${u.university}</b>

<br>

Country:
${u.country}

<br>

Chance:
${u.chance}

<br>

${u.reason}

</li>


`).join("")}


</ul>



`;



}


catch(error){


console.error(error);

alert("University recommendation failed");


}


}






// ==========================
// GET USER DATA
// ==========================


function getProfile(){


return {


gpa:
document.getElementById("gpa").value,


sat:
document.getElementById("sat").value,


ielts:
document.getElementById("ielts").value,


major:
document.getElementById("major").value,


country:
document.getElementById("country").value,


budget:
document.getElementById("budget").value,


activities:
document.getElementById("activities")
.value
.split("\n")
.filter(x=>x.trim()),


awards:
document.getElementById("awards")
.value
.split("\n")
.filter(x=>x.trim()),


research:
document.getElementById("research").value


};


}


</script>


</body>

</html>
