<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Extracurricular Activities</title>
</head>
<body>

<section>

    <h2>Find Extracurricular Activities</h2>

    <input
        type="text"
        id="major"
        placeholder="Major"
    >

    <br><br>

    <input
        type="text"
        id="interests"
        placeholder="Interests (AI, Robotics, Programming)"
    >

    <br><br>

    <input
        type="text"
        id="city"
        placeholder="City"
    >

    <br><br>

    <input
        type="text"
        id="country"
        placeholder="Country"
    >

    <br><br>

    <button onclick="findActivities()">
        Search Opportunities
    </button>

    <hr>

    <div id="results"></div>

</section>

<script>
async function findActivities() {

    const container = document.getElementById("results");
    container.innerHTML = "<p>Searching...</p>";

    try {

        const response = await fetch(
            "https://sat-backend-n13d.onrender.com/api/opportunities",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    major: document.getElementById("major").value,
                    interests: document.getElementById("interests").value
                        .split(",")
                        .map(i => i.trim())
                        .filter(i => i !== ""),
                    city: document.getElementById("city").value,
                    country: document.getElementById("country").value
                })
            }
        );

        const data = await response.json();

        console.log(data);

        if (!response.ok) {
            container.innerHTML = `<p>${data.error || "Unknown error"}</p>`;
            return;
        }

        if (!data.recommendations || data.recommendations.length === 0) {
            container.innerHTML = "<p>No recommendations found.</p>";
            return;
        }

        container.innerHTML = "";

        data.recommendations.forEach(activity => {

            container.innerHTML += `
                <div style="margin-bottom:20px;">
                    <h3>${activity.name}</h3>
                    <p>${activity.description}</p>
                    <p><strong>College Impact:</strong> ${activity.collegeImpact}/10</p>
                    <p><strong>Skills:</strong> ${activity.skills.join(", ")}</p>
                    <p>
                        <a href="${activity.website}" target="_blank">
                            Visit Website
                        </a>
                    </p>
                    <hr>
                </div>
            `;

        });

    } catch (err) {

        console.error(err);
        container.innerHTML = `<p>Error: ${err.message}</p>`;

    }

}
</script>

</body>
</html>
