<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Admission Profile Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fb;
        }

        h1 {
            text-align: center;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #eef2ff;
            border-radius: 10px;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
        }

        li {
            margin: 8px 0;
        }

    </style>
</head>

<body>

<div class="container">

<h1>AI Admission Profile Analyzer</h1>


<label>GPA</label>
<input id="gpa" placeholder="Example: 3.9">


<label>SAT Score</label>
<input id="sat" placeholder="Example: 1500">


<label>IELTS Score</label>
<input id="ielts" placeholder="Example: 8.0">


<label>Intended Major</label>
<input id="major" placeholder="Example: Computer Science">


<label>Extracurricular Activities</label>
<textarea id="activities"
placeholder="Example:
- Built a website
- Coding club president
- Volunteer tutor"></textarea>


<label>Awards & Achievements</label>
<textarea id="awards"
placeholder="Example:
- Math Olympiad finalist
- Hackathon winner"></textarea>


<label>Research / Projects</label>
<textarea id="research"
placeholder="Example:
- AI project
- Published research paper"></textarea>


<button onclick="analyzeProfile()">
Analyze My Profile
</button>


<div id="result"></div>


</div>


<script>

async function analyzeProfile(){

    const profile = {

        gpa: document.getElementById("gpa").value,

        sat: document.getElementById("sat").value,

        ielts: document.getElementById("ielts").value,

        major: document.getElementById("major").value,

        activities: document
            .getElementById("activities")
            .value
            .split("\n")
            .filter(x => x.trim() !== ""),

        awards: document
            .getElementById("awards")
            .value
            .split("\n")
            .filter(x => x.trim() !== ""),

        research: document
            .getElementById("research")
            .value

    };


    const response = await fetch(
        "http://localhost:3000/api/profile",
        {
            method: "POST",

            headers:{
                "Content-Type":"application/json"
            },

            body: JSON.stringify(profile)
        }
    );


    const data = await response.json();


    if(!data.success){

        document.getElementById("result").innerHTML =
        `
        <h3>Error</h3>
        <p>${data.error}</p>
        `;

        return;

    }


    const analysis = data.analysis;


    document.getElementById("result").innerHTML =
    `

    <h2>Admission Analysis</h2>

    <div class="score">
        Overall Score: ${analysis.overallScore}/100
    </div>


    <h3>Categories</h3>

    <ul>
        <li>Academics: ${analysis.categories.academics}/10</li>
        <li>Extracurriculars: ${analysis.categories.extracurriculars}/10</li>
        <li>Leadership: ${analysis.categories.leadership}/10</li>
        <li>Achievements: ${analysis.categories.achievements}/10</li>
        <li>Uniqueness: ${analysis.categories.uniqueness}/10</li>
    </ul>


    <h3>Strengths</h3>

    <ul>
        ${
            analysis.strengths
            .map(item => `<li>${item}</li>`)
            .join("")
        }
    </ul>


    <h3>Weaknesses</h3>

    <ul>
        ${
            analysis.weaknesses
            .map(item => `<li>${item}</li>`)
            .join("")
        }
    </ul>


    <h3>Recommendations</h3>

    <ul>
        ${
            analysis.recommendations
            .map(item => `<li>${item}</li>`)
            .join("")
        }
    </ul>

    `;

}

</script>

</body>
</html>
