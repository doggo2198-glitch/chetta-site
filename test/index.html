<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Admission Profile Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fb;
        }

        h1 {
            text-align: center;
            color: #1f2937;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 30px;
            background: #eef2ff;
            padding: 25px;
            border-radius: 12px;
        }

        .score {
            font-size: 30px;
            font-weight: bold;
            margin: 15px 0;
            color: #2563eb;
        }

        h2, h3 {
            color: #1f2937;
        }

        li {
            margin: 8px 0;
        }

    </style>

</head>


<body>


<div class="container">

<h1>
    AI Admission Profile Analyzer
</h1>


<label>
    GPA
</label>

<input 
    id="gpa"
    placeholder="Example: 4.0"
>


<label>
    SAT Score
</label>

<input 
    id="sat"
    placeholder="Example: 1410"
>


<label>
    IELTS Score
</label>

<input 
    id="ielts"
    placeholder="Example: 7.0"
>


<label>
    Intended Major
</label>

<input 
    id="major"
    placeholder="Example: Computer Science"
>


<label>
    Extracurricular Activities
</label>

<textarea 
    id="activities"
    placeholder="Example:
Built a website
Coding club member
Volunteer tutor">
</textarea>


<label>
    Awards and Achievements
</label>

<textarea 
    id="awards"
    placeholder="Example:
Olympiad finalist
Hackathon participant">
</textarea>


<label>
    Research / Projects
</label>

<textarea 
    id="research"
    placeholder="Example:
AI project
Research paper
Engineering project">
</textarea>


<button onclick="analyzeProfile()">
    Analyze My Profile
</button>


<div id="result">
    
</div>


</div>



<script>


async function analyzeProfile(){


    const profile = {


        gpa: document
            .getElementById("gpa")
            .value,


        sat: document
            .getElementById("sat")
            .value,


        ielts: document
            .getElementById("ielts")
            .value,


        major: document
            .getElementById("major")
            .value,


        activities: document
            .getElementById("activities")
            .value
            .split("\n")
            .filter(item => item.trim() !== ""),


        awards: document
            .getElementById("awards")
            .value
            .split("\n")
            .filter(item => item.trim() !== ""),


        research: document
            .getElementById("research")
            .value

    };



    try {


        const response = await fetch(

            "https://chetta-site.onrender.com/api/profile",

            {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },


                body: JSON.stringify(profile)

            }

        );



        const data = await response.json();



        if(!data.success){


            document.getElementById("result").innerHTML =

            `

            <h3>Error</h3>

            <p>
                ${data.error}
            </p>

            `;


            return;

        }



        const analysis = data.analysis;



        document.getElementById("result").innerHTML =


        `


        <h2>
            Admission Analysis
        </h2>


        <div class="score">

            Overall Score:
            ${analysis.overallScore}/100

        </div>



        <h3>
            Categories
        </h3>


        <ul>

            <li>
                Academics:
                ${analysis.categories.academics}/100
            </li>


            <li>
                Extracurriculars:
                ${analysis.categories.extracurriculars}/100
            </li>


            <li>
                Leadership:
                ${analysis.categories.leadership}/100
            </li>


            <li>
                Achievements:
                ${analysis.categories.achievements}/100
            </li>


            <li>
                Uniqueness:
                ${analysis.categories.uniqueness}/100
            </li>

        </ul>



        <h3>
            Strengths
        </h3>


        <ul>

            ${
                analysis.strengths
                .map(item => `<li>${item}</li>`)
                .join("")
            }

        </ul>




        <h3>
            Weaknesses
        </h3>


        <ul>

            ${
                analysis.weaknesses
                .map(item => `<li>${item}</li>`)
                .join("")
            }

        </ul>




        <h3>
            Recommendations
        </h3>


        <ul>

            ${
                analysis.recommendations
                .map(item => `<li>${item}</li>`)
                .join("")
            }

        </ul>


        `;



    }

    catch(error){


        console.error(error);


        document.getElementById("result").innerHTML =

        `

        <h3>
            Connection Error
        </h3>

        <p>
            Could not connect to the server.
        </p>

        `;


    }



}


</script>



</body>

</html>
