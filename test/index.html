<html>
  <body>
<section>

    <h2>Find Extracurricular Activities</h2>

    <input
        type="text"
        id="major"
        placeholder="Major"
    >

    <br><br>

    <input
        type="text"
        id="interests"
        placeholder="Interests (AI, Robotics, Programming)"
    >

    <br><br>

    <input
        type="text"
        id="city"
        placeholder="City"
    >

    <br><br>

    <input
        type="text"
        id="country"
        placeholder="Country"
    >

    <br><br>

    <button onclick="findActivities()">
        Search Opportunities
    </button>

    <hr>

    <div id="results"></div>

</section>

<script>
async function findActivities() {

    const container = document.getElementById("results");
    container.innerHTML = "<p>Searching...</p>";

    try {

        const response = await fetch(
            "http://localhost:3000/api/opportunities",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    major: document.getElementById("major").value,
                    interests: document.getElementById("interests").value
                        .split(",")
                        .map(i => i.trim()),
                    city: document.getElementById("city").value,
                    country: document.getElementById("country").value
                })
            }

    );


    const data = await response.json();

    console.log(data);

    const container =
    document.getElementById("results");

    container.innerHTML = "";


    if(!data.recommendations){

        container.innerHTML =
        "<p>No recommendations found.</p>";

        return;

    }


    data.recommendations.forEach(activity=>{

        const div =
        document.createElement("div");

        div.innerHTML = `

            <h3>${activity.name}</h3>

            <p>${activity.description}</p>

            <p>

                <strong>College Impact:</strong>

                ${activity.collegeImpact}/10

            </p>

            <p>

                <strong>Skills:</strong>

                ${activity.skills.join(", ")}

            </p>

            <a
                href="${activity.website}"
                target="_blank"
            >
                Visit Website
            </a>

            <hr>

        `;

        container.appendChild(div);

      

        const data = await response.json();

        console.log(data);

        if (!response.ok) {
            container.innerHTML = `<p>Error: ${data.error || "Unknown error"}</p>`;
            return;
        }

        container.innerHTML = "";

        data.recommendations.forEach(activity => {

            container.innerHTML += `
                <div>
                    <h3>${activity.name}</h3>
                    <p>${activity.description}</p>
                    <p><strong>Impact:</strong> ${activity.collegeImpact}/10</p>
                    <p><strong>Skills:</strong> ${activity.skills.join(", ")}</p>
                    <a href="${activity.website}" target="_blank">Visit Website</a>
                    <hr>
                </div>
            `;

        });

    } catch (err) {

        console.error(err);
        container.innerHTML = `<p>${err.message}</p>`;

    }

}
    });

}

</script>
  </body>
</html>
